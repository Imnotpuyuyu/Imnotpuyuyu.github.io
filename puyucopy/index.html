<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffedf">
<meta name="description" content="🥺を育てて、タップと壁タッチでポイントを増やすミニゲーム。">
<title>🥺 ぷゆゆ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fffedf;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
  }

  .frame {
    position: relative;
    width: 640px;
    height: 640px;
    background: #fffedf;
    border: 6px solid #000;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 10px 0 10px;
    box-sizing: border-box;
    z-index: 10;
    pointer-events: none;
  }
  .top-bar .nav-item { pointer-events: auto; }

  .points {
    font-size: 27px;
    color: #111;
    display: flex;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
  }
  .points .emoji { font-size: 27px; }

  .nav {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
  }
  .nav-item {
    font-size: 27px;
    color: #111;
    cursor: pointer;
  }
  .nav-item:hover { text-decoration: underline; }

  /* ショップ表示中の「閉／上／下」ナビ：画像参照どおり大きな文字でリスト上に重なる */
  .nav.shop-nav {
    gap: 14px;
    position: absolute;
    top: 54px;
    right: 27px;
  }
  .nav.shop-nav .nav-item {
    font-size: 44px;
    line-height: 1;
  }

  .play-area {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
  }

  .face {
    position: absolute;
    font-size: 124px;
    line-height: 1;
    cursor: pointer;
    will-change: left, top, transform;
  }

  .bottom-stats {
    position: absolute;
    right: 14px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 20px;
    color: #6b6b6b;
    font-size: 27px;
    pointer-events: none;
    z-index: 2;
  }
  .bottom-stats .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .bottom-stats .emoji { font-size: 27px; }
  .bottom-stats .stat {
    cursor: pointer;
    pointer-events: auto;
    transition: opacity 0.12s ease;
  }

  /* ポイント不足時は半透明 */
  .bottom-stats .stat.cannot-afford {
    opacity: 0.42;
  }

  .gain-pop {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    font-size: 24px;
    line-height: 1;
    color: #111;
    font-weight: 400;
    transform: translate(-50%, 0);
    animation: gainFade 0.7s ease-out forwards;
    white-space: nowrap;
  }

  @keyframes gainFade {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---- ショップ画面 ---- */
  .shop-panel {
    position: absolute;
    top: 30px;
    left: 31px;
    right: 23px;
    bottom: 31px;
    z-index: 6;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: #fdffbc;
  }
  .shop-panel[hidden] { display: none; }

  .shop-page {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 483px;
    box-sizing: border-box;
    padding: 10px 0 0 0;
    margin-left: 8px;
  }
  .shop-page[hidden] { display: none; }

  .shop-row {
    display: flex;
    height: 55px;
    align-items: center;
    background: #ffffdf;
    border-radius: 8px;
    padding: 9px 17px;
    box-sizing: border-box;
  }
  .shop-icon-big {
    font-size: 25px;
    line-height: 1;
    margin-right: 16px;
    flex-shrink: 0;
  }
  .shop-icon-big.smy {
    font-size: 19px;
    color: #b3b3a8;
    font-style: italic;
    letter-spacing: 0.5px;
  }
  .shop-desc {
    font-size: 17px;
    color: #333;
    white-space: nowrap;
  }
  .shop-cost {
    font-size: 17px;
    color: #333;
    white-space: nowrap;
    margin-left: 8px;
  }
  .shop-row.purchased { opacity: 0.42; }

  /* ---- GitHub Pages / responsive polish ---- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }
  body {
    padding: max(12px, env(safe-area-inset-top))
             max(12px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom))
             max(12px, env(safe-area-inset-left));
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,.9), transparent 38%),
      #fffedf;
  }
  .frame {
    width: min(640px, calc(100vw - 24px));
    height: min(640px, calc(100vh - 24px));
    min-width: 280px;
    min-height: 280px;
    border: clamp(3px, .8vw, 6px) solid #000;
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0,0,0,.12);
  }
  .top-bar { padding: 7px 12px 0; }
  .points, .nav-item, .bottom-stats { font-size: clamp(16px, 4.2vw, 27px); }
  .points .emoji, .bottom-stats .emoji { font-size: 1em; }
  .nav { gap: 8px; }
  .nav-item {
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item:active { transform: translateY(1px); }
  .nav.shop-nav { top: 48px; right: 20px; gap: 8px; }
  .nav.shop-nav .nav-item {
    font-size: clamp(28px, 7vw, 44px);
    min-height: 42px;
  }
  .face {
    font-size: clamp(76px, 19.4vw, 124px);
    width: 1em;
    height: 1em;
    display: grid;
    place-items: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-stats { right: 12px; bottom: 12px; gap: 10px; }
  .bottom-stats .stat {
    min-height: 34px;
    padding: 2px 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .shop-panel {
    top: 30px;
    left: 28px;
    right: 22px;
    bottom: 28px;
    overflow: hidden;
    border-radius: 10px;
  }
  .shop-page {
    width: min(483px, calc(100% - 8px));
    gap: 8px;
    padding-top: 8px;
  }
  .shop-row {
    min-height: 52px;
    height: auto;
    padding: 8px 13px;
    cursor: pointer;
    transition: transform .08s ease, opacity .12s ease;
    touch-action: manipulation;
  }
  .shop-row:active { transform: scale(.99); }
  .shop-icon-big {
    font-size: 24px;
    width: 34px;
    text-align: center;
    margin-right: 10px;
  }
  .shop-desc, .shop-cost { font-size: clamp(13px, 2.7vw, 17px); }
  @media (max-width: 430px) {
    body { padding: 6px; }
    .frame {
      width: calc(100vw - 12px);
      height: calc(100vh - 12px);
      border-radius: 10px;
    }
    .top-bar { padding: 6px 9px 0; }
    .shop-panel { top: 25px; left: 14px; right: 12px; bottom: 14px; }
    .shop-page { margin-left: 4px; width: calc(100% - 8px); }
    .shop-row { padding: 7px 9px; }
    .shop-icon-big { margin-right: 6px; width: 30px; }
    .bottom-stats { right: 8px; bottom: 8px; }
  }
  @media (max-height: 520px) {
    .bottom-stats { gap: 4px; }
    .shop-row { min-height: 42px; padding-top: 5px; padding-bottom: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gain-pop { animation-duration: .01ms; }
    .shop-row { transition: none; }
  }

</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="top-bar">
    <div class="points">
      <span class="emoji" id="faceIconTop">🥺</span><span id="pointsVal">0</span>
    </div>
    <div class="nav" id="navBox">
      <div class="nav-item" id="shopBtn">ショップ</div>
      <div class="nav-item" id="shareBtn">共有</div>
    </div>
  </div>

  <div class="play-area" id="playArea">
    <div class="face" id="face" role="button" tabindex="0" aria-label="🥺をタップ">🥺</div>
  </div>

  <audio id="sfxTap" preload="auto" src="assets/sfx/tap.mp3"></audio>
  <audio id="sfxWall" preload="auto" src="assets/sfx/wall.mp3"></audio>

  <div class="shop-panel" id="shopPanel" hidden>
    <div class="shop-page" id="shopPage1"></div>
    <div class="shop-page" id="shopPage2" hidden></div>
    <div class="shop-page" id="shopPage3" hidden></div>
    <div class="shop-page" id="shopPage4" hidden></div>
    <div class="shop-page" id="shopPage5" hidden></div>
    <div class="shop-page" id="shopPage6" hidden></div>
  </div>
  <div class="bottom-stats">
    <div class="stat" id="wallUpgrade" title="壁タッチ強化">壁タッチ(Lv<span id="wallLv">1</span>) <span class="emoji">🥺</span><span id="wallCost">50</span></div>
    <div class="stat" id="tapUpgrade" title="タップ強化">タップ(Lv<span id="tapLv">1</span>) <span class="emoji">🥺</span><span id="tapCost">50</span></div>
  </div>
</div>

<script>
// ---- 状態（ゲーム開始時の初期値）----
let points   = 0;
let tapLevel = 1;
let tapValue = 1;
let wallLevel = 1;
let wallValue = 0;

// 本体強化：初期価格50、購入ごとに価格2.2倍（小数点以下切り捨て）。
// 効果量：+1、+2、+4、+8…の2累乗（小数点以下切り捨て）。
const tapUpgradeBaseCost = 50;
const wallUpgradeBaseCost = 50;
const upgradeCostGrowth = 2.2;

function upgradeCost(baseCost, level) {
  return Math.floor(baseCost * Math.pow(upgradeCostGrowth, level - 1));
}

function roundEffect(value) {
  return Math.floor(value);
}

function tapUpgradeCost() {
  return upgradeCost(tapUpgradeBaseCost, tapLevel);
}

function wallUpgradeCost() {
  return upgradeCost(wallUpgradeBaseCost, wallLevel);
}

const pointsVal = document.getElementById('pointsVal');
const wallLv    = document.getElementById('wallLv');
const tapLv     = document.getElementById('tapLv');
const wallCostEl = document.getElementById('wallCost');
const tapCostEl  = document.getElementById('tapCost');
const wallUpgradeEl = document.getElementById('wallUpgrade');
const tapUpgradeEl  = document.getElementById('tapUpgrade');
const frame     = document.getElementById('frame');
const face      = document.getElementById('face');
const faceIconTop = document.getElementById('faceIconTop');
const playArea  = document.getElementById('playArea');
const bottomStats = document.querySelector('.bottom-stats');

function formatNumber(value) {
  return String(Math.floor(value));
}

function refreshDisplay() {
  const tapCost = tapUpgradeCost();
  const wallCost = wallUpgradeCost();

  pointsVal.textContent = formatNumber(points);
  tapCostEl.textContent = formatNumber(tapCost);
  wallCostEl.textContent = formatNumber(wallCost);

  tapLv.textContent = tapLevel;
  wallLv.textContent = wallLevel;

  // 強化UIは購入不可時ではなく、ポイント不足時だけ半透明。
  tapUpgradeEl.classList.toggle('cannot-afford', points < tapCost);
  wallUpgradeEl.classList.toggle('cannot-afford', points < wallCost);
}
refreshDisplay();

// ---- 移動・反射ロジック ----
let moving = false;
let x = 0, y = 0;      // 左上基準の座標
let vx = 0, vy = 0;
const speed = 3.0;
const faceSize = 124;

function areaSize() {
  return { w: playArea.clientWidth, h: playArea.clientHeight };
}

function placeCenter() {
  const { w, h } = areaSize();
  x = (w - faceSize) / 2;
  y = (h - faceSize) / 2;
  face.style.left = x + 'px';
  face.style.top  = y + 'px';
}
placeCenter();

function randomDirection() {
  const angle = Math.random() * Math.PI * 2;
  vx = Math.cos(angle) * speed;
  vy = Math.sin(angle) * speed;
  if (Math.abs(vx) < 0.6) vx = vx < 0 ? -0.6 : 0.6;
  if (Math.abs(vy) < 0.6) vy = vy < 0 ? -0.6 : 0.6;
}

// ---- 効果音：効果音ラボ素材（ローカル配置） ----
  // 音源は assets/sfx/ に置く。直リンクは使わない。
  const sfx = {
    tap: document.getElementById('sfxTap'),
    wall: document.getElementById('sfxWall')
  };

  function playSfx(type) {
    const audio = sfx[type];
    if (!audio) return;
    try {
      audio.currentTime = 0;
      audio.volume = type === 'wall' ? 0.34 : 0.24;
      const promise = audio.play();
      if (promise && typeof promise.catch === 'function') promise.catch(() => {});
    } catch (_) {}
  }

let animBusy = false;
function playClickAnimation() {
  if (animBusy) return;
  animBusy = true;
  const sequence = ['💥', '🤪', '🥺'];
  let i = 0;
  const timer = setInterval(() => {
    face.textContent = sequence[i];
    faceIconTop.textContent = sequence[i] === '🥺' ? '🥺' : faceIconTop.textContent;
    i++;
    if (i >= sequence.length) {
      clearInterval(timer);
      animBusy = false;
    }
  }, 90);
}

function upgradeTap() {
  const cost = tapUpgradeCost();
  if (points < cost) return;

  points -= cost;
  tapLevel += 1;
  // 効果は +1、+2、+4、+8… と2累乗で増加。
  tapValue = Math.floor(Math.pow(2, tapLevel - 1));
  recalculateShopEffects();
  refreshDisplay();
}

function upgradeWall() {
  const cost = wallUpgradeCost();
  if (points < cost) return;

  points -= cost;
  wallLevel += 1;
  // 壁はLv1=0。最初の購入で+1、その後は+2、+4、+8…と2累乗。
  wallValue = Math.floor(Math.pow(2, wallLevel - 2));
  recalculateShopEffects();
  refreshDisplay();
}

function showGainPopup(amount, event) {
  const rect = frame.getBoundingClientRect();
  let xPos = rect.width / 2;
  let yPos = rect.height / 2;

  if (event && typeof event.clientX === 'number') {
    xPos = event.clientX - rect.left;
    yPos = event.clientY - rect.top;
  }

  const pop = document.createElement('div');
  pop.className = 'gain-pop';
  pop.textContent = '+' + formatNumber(amount);
  pop.style.left = xPos + 'px';
  pop.style.top = yPos + 'px';
  frame.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove(), { once: true });
}

function onFaceClick(event) {
  playSfx('tap');
  lastActivityAt = Date.now();
  const stateBonus = faceState === '😳' ? state2TapBonus : (faceState === '🥹' ? state1TapBonus : 1);
  const gained = Math.floor(tapValue * stateBonus);
  points += gained;
  showGainPopup(gained, event);
  refreshDisplay();
  playClickAnimation();

  // タップすると放置タイマーをリセットし、状態も🥺へ戻す。
  if (stateEvolutionUnlocked) {
    faceState = 'sad';
    face.textContent = '🥺';
    faceIconTop.textContent = '🥺';
  }

  if (!moving) {
    moving = true;
    randomDirection();
  } else {
    randomDirection();
  }
}

face.addEventListener('click', onFaceClick);
  face.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      onFaceClick(event);
    }
  });

document.getElementById('wallUpgrade').addEventListener('click', upgradeWall);
document.getElementById('tapUpgrade').addEventListener('click', upgradeTap);

function step() {
  if (moving) {
    const { w, h } = areaSize();
    x += vx;
    y += vy;

    let bounced = false;
    if (x <= 0) { x = 0; vx = -vx; bounced = true; }
    if (x + faceSize >= w) { x = w - faceSize; vx = -vx; bounced = true; }
    if (y <= 0) { y = 0; vy = -vy; bounced = true; }
    if (y + faceSize >= h) { y = h - faceSize; vy = -vy; bounced = true; }

    if (bounced && wallLevel >= 2) {
      playSfx('wall');
      points += Math.floor(wallValue);
      refreshDisplay();
    }

    face.style.left = x + 'px';
    face.style.top  = y + 'px';
  }

  updateFaceState();
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// ---- ショップ：全6ページ、各8アイテム ----
// 1～3ページ：クリック/壁タッチの%強化。
// 4～6ページ：クリック/壁タッチの倍率強化。
// すべて1回限りの購入で、購入済みだけ半透明。
const shopItems = [
  // [絵文字, 説明, 効果種別, 効果倍率, 値段]
  // 「効率化」はクリック・壁タッチの両方を強化する共通効果。
  [
    ['🤓', '🥺を10%効率化', 'efficiency', 1.10, 10000],
    ['😡', '🥺を20%効率化', 'efficiency', 1.20, 26000],
    ['🤔', '🥺を30%効率化', 'efficiency', 1.30, 67600],
    ['😭', '🥺を40%効率化', 'efficiency', 1.40, 175760],
    ['😎', '🥺を50%効率化', 'efficiency', 1.50, 456976],
    ['🤗', '🥺を60%効率化', 'efficiency', 1.60, 1188137],
    ['😫', '🥺を70%効率化', 'efficiency', 1.70, 3089157],
    ['🤢', '🥺を80%効率化', 'efficiency', 1.80, 8031810]
  ],
  [
    ['😻', '🥺を100%効率化', 'efficiency', 2.00, 120000],
    ['😁', '🥺を120%効率化', 'efficiency', 2.20, 288000],
    ['SMY', '🥺を150%効率化', 'efficiency', 2.50, 691200],
    ['✋', '🥺を180%効率化', 'efficiency', 2.80, 1658879],
    ['🤙', '🥺を220%効率化', 'efficiency', 3.20, 3981312],
    ['👊', '🥺を250%効率化', 'efficiency', 3.50, 9555148],
    ['🍚', '🥺を300%効率化', 'efficiency', 4.00, 22932357],
    ['🥩', '🥺を350%効率化', 'efficiency', 4.50, 55037657]
  ],
  [
    ['😮', '🥺を400%効率化', 'efficiency', 5.00, 1000000],
    ['😲', '🥺を450%効率化', 'efficiency', 5.50, 2250000],
    ['🤩', '🥺を500%効率化', 'efficiency', 6.00, 5062500],
    ['😺', '🥺を600%効率化', 'efficiency', 7.00, 11390625],
    ['😸', '🥺を700%効率化', 'efficiency', 8.00, 25628906],
    ['😹', '🥺を800%効率化', 'efficiency', 9.00, 57665039],
    ['🙀', '🥺を900%効率化', 'efficiency', 10.00, 129746337],
    ['😿', '🥺を1000%効率化', 'efficiency', 11.00, 291929260]
  ],
  [
    ['🥳', '🥺が2倍増加', 'multiplier', 2, 6000000],
    ['😈', '🥺が2倍増加', 'multiplier', 2, 12600000],
    ['👻', '🥺が3倍増加', 'multiplier', 3, 26460000],
    ['👽', '🥺が3倍増加', 'multiplier', 3, 55566000],
    ['🤖', '🥺が4倍増加', 'multiplier', 4, 116688600],
    ['💩', '🥺が4倍増加', 'multiplier', 4, 245046060],
    ['🔥', '🥺が5倍増加', 'multiplier', 5, 514596726],
    ['⭐', '🥺が5倍増加', 'multiplier', 5, 1080653124]
  ],
  [
    ['🌟', '🥺が6倍増加', 'multiplier', 6, 30000000],
    ['💫', '🥺が6倍増加', 'multiplier', 6, 60000000],
    ['⚡', '🥺が8倍増加', 'multiplier', 8, 120000000],
    ['💥', '🥺が8倍増加', 'multiplier', 8, 240000000],
    ['🎯', '🥺が10倍増加', 'multiplier', 10, 480000000],
    ['🎲', '🥺が10倍増加', 'multiplier', 10, 960000000],
    ['👑', '🥺が12倍増加', 'multiplier', 12, 1920000000],
    ['💎', '🥺が12倍増加', 'multiplier', 12, 3840000000]
  ],
  [
    ['🚀', '🥺が15倍増加', 'multiplier', 15, 120000000],
    ['🌈', '🥺が15倍増加', 'multiplier', 15, 228000000],
    ['☀️', '🥺が20倍増加', 'multiplier', 20, 433200000],
    ['🌙', '🥺が20倍増加', 'multiplier', 20, 823079999],
    ['💰', '🥺が25倍増加', 'multiplier', 25, 1563851999],
    ['🏆', '🥺が25倍増加', 'multiplier', 25, 2971318799],
    ['🔱', '🥺が30倍増加', 'multiplier', 30, 5645505719],
    ['✨', '🥺が30倍増加', 'multiplier', 30, 10726460867],
    // 😳の効果もここで手動指定
    ['😳', '🥺が2倍増加・😳状態になる', 'stateUnlock', 2, 15000000000]
  ]
];

const purchasedShopItems = new Set();

// 放置状態：😳アイテム購入後、一定時間の放置で🥹→😳へ変化。
let stateEvolutionUnlocked = false;
let faceState = 'sad';
let lastActivityAt = Date.now();
const state1DelayMs = 10000;
const state2DelayMs = 20000;
const state1TapBonus = 2;
const state2TapBonus = 3;

// ショップ効果は「効率化 → 倍増加」の順で適用。
let shopEfficiencyMultiplier = 1;
let shopMultiplier = 1;
let stateShopMultiplier = 1;

function shopItemCost(pageIndex, itemIndex) {
  return shopItems[pageIndex][itemIndex][4];
}

function getBaseTapValue() {
  return Math.floor(Math.pow(2, tapLevel - 1));
}

function getBaseWallValue() {
  return wallLevel >= 2 ? Math.floor(Math.pow(2, wallLevel - 2)) : 0;
}

function recalculateShopEffects() {
  const baseTap = getBaseTapValue();
  const baseWall = getBaseWallValue();

  const commonMultiplier = shopEfficiencyMultiplier * shopMultiplier;
  tapValue = Math.floor(baseTap * commonMultiplier * stateShopMultiplier);
  wallValue = baseWall === 0 ? 0 : Math.floor(baseWall * commonMultiplier);
}

function applyShopItem(item) {
  const [, , type, value] = item;

  if (type === 'efficiency') {
    shopEfficiencyMultiplier *= value;
  } else if (type === 'multiplier') {
    shopMultiplier *= value;
  } else if (type === 'stateUnlock') {
    stateEvolutionUnlocked = true;
    stateShopMultiplier *= value;
    lastActivityAt = Date.now();
    faceState = 'sad';
    face.textContent = '🥺';
    faceIconTop.textContent = '🥺';
  }

  recalculateShopEffects();
}

function updateFaceState() {
  if (!stateEvolutionUnlocked) return;

  const idleMs = Date.now() - lastActivityAt;
  let nextState = 'sad';
  if (idleMs >= state2DelayMs) nextState = '😳';
  else if (idleMs >= state1DelayMs) nextState = '🥹';

  if (nextState !== faceState) {
    faceState = nextState;
    face.textContent = nextState === 'sad' ? '🥺' : nextState;
    faceIconTop.textContent = nextState === 'sad' ? '🥺' : nextState;
  }
}

function buildShop() {
  shopPages.forEach((pageEl, pageIndex) => {
    pageEl.innerHTML = '';

    shopItems[pageIndex].forEach((item, itemIndex) => {
      const key = pageIndex + ':' + itemIndex;
      const row = document.createElement('div');
      row.className = 'shop-row';

      const icon = document.createElement('span');
      icon.className = 'shop-icon-big';
      if (item[0] === 'SMY') icon.classList.add('smy');
      icon.textContent = item[0];

      const desc = document.createElement('span');
      desc.className = 'shop-desc';
      desc.textContent = item[1];

      const cost = document.createElement('span');
      cost.className = 'shop-cost';
      cost.textContent = '🥺' + shopItemCost(pageIndex, itemIndex);

      row.appendChild(icon);
      row.appendChild(desc);
      row.appendChild(cost);
      row.addEventListener('click', () => purchaseShopItem(pageIndex, itemIndex, row));
      pageEl.appendChild(row);
    });
  });
}

function purchaseShopItem(pageIndex, itemIndex, row) {
  const key = pageIndex + ':' + itemIndex;
  if (purchasedShopItems.has(key)) return;

  const cost = shopItemCost(pageIndex, itemIndex);
  if (points < cost) return;

  points -= cost;
  purchasedShopItems.add(key);
  applyShopItem(shopItems[pageIndex][itemIndex]);
  row.classList.add('purchased');
  refreshDisplay();
}

const navBox = document.getElementById('navBox');
const shopPanel = document.getElementById('shopPanel');
const shopPages = [
  document.getElementById('shopPage1'),
  document.getElementById('shopPage2'),
  document.getElementById('shopPage3'),
  document.getElementById('shopPage4'),
  document.getElementById('shopPage5'),
  document.getElementById('shopPage6')
];
let shopPageIndex = 0;

const mainNavHTML = `
  <div class="nav-item" id="shopBtn">ショップ</div>
  <div class="nav-item" id="shareBtn">共有</div>
`;
const shopNavHTML = `
  <div class="nav-item" id="shopClose">閉</div>
  <div class="nav-item" id="shopUp">上</div>
  <div class="nav-item" id="shopDown">下</div>
`;

function showShopPage(index) {
  shopPageIndex = Math.max(0, Math.min(shopPages.length - 1, index));
  shopPages.forEach((page, i) => { page.hidden = (i !== shopPageIndex); });
}

function openShop() {
  shopPanel.hidden = false;
  showShopPage(0);
  navBox.innerHTML = shopNavHTML;
  navBox.classList.add('shop-nav');
  document.getElementById('shopClose').addEventListener('click', closeShop);
  document.getElementById('shopUp').addEventListener('click', () => showShopPage(shopPageIndex - 1));
  document.getElementById('shopDown').addEventListener('click', () => showShopPage(shopPageIndex + 1));
}

function closeShop() {
  shopPanel.hidden = true;
  navBox.classList.remove('shop-nav');
  navBox.innerHTML = mainNavHTML;
  document.getElementById('shopBtn').addEventListener('click', openShop);
  document.getElementById('shareBtn').addEventListener('click', captureGameScreenshot);
}

buildShop();
document.getElementById('shopBtn').addEventListener('click', openShop);
async function captureGameScreenshot() {
  const frameEl = document.getElementById('frame');
  if (!shopPanel.hidden) closeShop();

  try {
    const clone = frameEl.cloneNode(true);
    clone.querySelectorAll('.gain-pop').forEach(el => el.remove());

    // foreignObject を使ったPNG化はブラウザによって「tainted canvas」になるため、
    // SVGを自己完結させてからPNG化し、失敗時はSVGとして保存する。
    const styleText = Array.from(document.querySelectorAll('style'))
      .map(style => style.textContent)
      .join('\n');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${frameEl.offsetWidth}" height="${frameEl.offsetHeight}">` +
      `<foreignObject x="0" y="0" width="100%" height="100%">` +
      `<div xmlns="http://www.w3.org/1999/xhtml"><style>${styleText}</style>${new XMLSerializer().serializeToString(clone)}</div>` +
      `</foreignObject></svg>`;

    const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();

    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });

    const canvas = document.createElement('canvas');
    canvas.width = frameEl.offsetWidth * 2;
    canvas.height = frameEl.offsetHeight * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    try {
      const png = await new Promise((resolve, reject) => {
        try {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG変換に失敗しました')), 'image/png');
        } catch (e) {
          reject(e);
        }
      });
      const pngUrl = URL.createObjectURL(png);
      const a = document.createElement('a');
      a.href = pngUrl;
      a.download = 'pupuyu-screenshot.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
    } catch (pngError) {
      // tainted canvas の場合でも共有機能自体が失敗しないようSVGへフォールバック。
      console.warn('PNG化をスキップし、SVGとして保存します:', pngError);
      const fallbackUrl = URL.createObjectURL(svgBlob);
      const a = document.createElement('a');
      a.href = fallbackUrl;
      a.download = 'pupuyu-screenshot.svg';
      a.click();
      setTimeout(() => URL.revokeObjectURL(fallbackUrl), 1000);
    }
  } catch (e) {
    console.error(e);
    alert('スクリーンショットを作成できませんでした。');
  }
}


document.getElementById('shareBtn').addEventListener('click', captureGameScreenshot);
</script>
